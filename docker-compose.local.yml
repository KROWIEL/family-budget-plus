# Локальный запуск без Caddy и HTTPS.
# Использование:  docker compose -f docker-compose.local.yml up -d --build
# Открыть:        http://localhost:8080
services:
  app:
    build: .
    image: family-budget-plus
    container_name: family-budget-plus-local
    env_file:
      - .env
    environment:
      # по http браузер не отправит Secure-cookie
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
